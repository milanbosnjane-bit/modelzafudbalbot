name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ios_app/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build FootballROIBot.ipa
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project FootballROIBot.xcodeproj

      - name: Build Release (unsigned)
        run: |
          set -euo pipefail
          set -x
          xcodebuild \
            -project FootballROIBot.xcodeproj \
            -scheme FootballROIBot \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log
          tail -n 50 build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData -path "*/Build/Products/Release-iphoneos/FootballROIBot.app" -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "FootballROIBot.app not found. Searching build output..."
            find build/DerivedData -name "*.app" -type d
            exit 1
          fi
          echo "Using app bundle: $APP_PATH"
          rm -rf Payload FootballROIBot.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FootballROIBot.ipa Payload
          ls -lh FootballROIBot.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootballROIBot-ipa
          path: ios_app/FootballROIBot.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Football ROIBot iOS Build ${{ github.run_number }}
          body: |
            Unsigned IPA for sideloading (AltStore / Sideloadly).
            Commit: ${{ github.sha }}
          files: ios_app/FootballROIBot.ipa
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
